# SPDX-License-Identifier: GPL-3.0-only
[group]
id = "conditions.language"
title = "Condition language"
origin = "original"
reference = "libloot"
item_column = "Item"
status_column = "Status"
notes_column = "Notes"

[[item]]
id = "operators"
title = "`and`, `or`, `not`, parentheses, C-style precedence"
status = "implemented"
ref = ["libloot:condition.grammar"]

[[item]]
id = "whitespace"
title = "Whitespace and line breaks around operators and arguments"
status = "implemented"
ref = ["libloot:condition.whitespace"]

[[item]]
id = "regex_detection"
title = "Regex detection (`:\\*?|` in the argument)"
status = "implemented"
notes = "Only the file name part is a regex; the directory is literal"
ref = ["libloot:condition.regex_path"]

[[item]]
id = "file"
title = "`file(path)`, `file(regex)`"
status = "implemented"
notes = "Relative to `Data`, `..` allowed, case-insensitive"
ref = ["libloot:condition.file", "libloot:condition.file_regex"]

[[item]]
id = "active"
title = "`active(path)`, `active(regex)`"
status = "implemented"
notes = "In the plugin list as active and installed"
ref = ["libloot:condition.active", "libloot:condition.active_regex"]

[[item]]
id = "many"
title = "`many(regex)`, `many_active(regex)`"
status = "implemented"
ref = ["libloot:condition.many", "libloot:condition.many_active"]

[[item]]
id = "file_size"
title = "`file_size(path, size)`"
status = "implemented"
ref = ["libloot:condition.file_size"]

[[item]]
id = "readable"
title = "`readable(path)`"
status = "implemented"
ref = ["libloot:condition.readable"]

[[item]]
id = "is_master"
title = "`is_master(path)`"
status = "implemented"
notes = "Master flag of the plugin header"
ref = ["libloot:condition.is_master"]

[[item]]
id = "checksum"
title = "`checksum(path, crc)`"
status = "implemented"
notes = "CRC-32 of the whole file; `0x` prefix accepted"
ref = ["libloot:condition.checksum"]

[[item]]
id = "version"
title = "`version(path, op, version)` and the older argument order"
status = "implemented"
notes = "Plugins, in every build: the version is read from the description field (`src/version.rs`, libloot's `extract_version` and the interpreter's comparison, ported; a timestamp, `version:` and a pseudo-semver, a bare pseudo-semver, then `v` or `version:` and a number). A plugin that is not installed or not in the load order, or whose description has no version, makes the condition false, as in libloot; a plugin that cannot be read is a condition error. Executables and DLLs (fixed file version, path relative to `Data`, `..` allowed; a missing file is false) through the default cargo feature `executable-versions`; with `default-features = false` they are parsed, evaluate to \"unsupported\" and the item is not applied. All six comparators are tested on synthetic images"
ref = ["libloot:condition.version", "libloot:condition.version_reversed"]
evidence = ["src/version.rs"]

[[item]]
id = "product_version"
title = "`product_version(path, op, version)`"
status = "implemented"
notes = "Executables and DLLs with the default feature `executable-versions` (the `ProductVersion` string; a missing file is false); without it unsupported"
ref = ["libloot:condition.product_version", "libloot:condition.product_version_reversed"]

[[item]]
id = "filename_version"
title = "`filename_version(regex, op, version)` and the other argument order"
status = "implemented"
notes = "As `loot-condition-interpreter`: a file of the path's directory whose whole name (ghost extension removed, case ignored) matches and whose single capture group, as a version, compares true. Exactly one capture group, else a syntax error. Compared with libloot on random worlds"
ref = ["libloot:condition.filename_version", "libloot:condition.filename_version_reversed"]

[[item]]
id = "description_contains"
title = "`description_contains(path, regex)`"
status = "implemented"
notes = "The plugin's description (decoded as Windows-1252, as esplugin does), case-insensitive, unanchored; false for a missing file, a non-plugin or no description. Compared with libloot on random worlds"
ref = ["libloot:condition.description_contains"]

[[item]]
id = "is_executable"
title = "`is_executable(path)`"
status = "implemented"
notes = "True when the file reads as a PE image by this crate's bounded reader (the interpreter's rule: headers, sections and the version resource, if any, read without an error); a file the interpreter would read with absurd sizes is false here instead of being read. Every build, no feature needed"
ref = ["libloot:condition.is_executable"]

[[item]]
id = "version_grammar"
title = "Version comparison grammar"
status = "implemented"
notes = "LOOT's own (Pseudosem as the interpreter implements it), ported in `src/version.rs`; no dependency. `filename_version` uses it too"
ref = ["libloot:condition.version_syntax"]

[[item]]
id = "caching"
title = "Evaluation caching"
status = "implemented"
notes = "Per sort: condition results by their text (as libloot caches them), compiled regular expressions, directory listings and checksums"

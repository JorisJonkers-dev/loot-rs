[package]
name = "loot-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
description = "Read-only evaluator of LOOT masterlist rules over a Fallout: New Vegas load order."
repository = "https://github.com/JorisJonkers-dev/loot-fnv"
publish = false

[dependencies]
yaml-rust2 = "0.10"
regex = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

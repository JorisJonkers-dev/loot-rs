[package]
name = "loot-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
description = "Read-only evaluator of LOOT masterlist rules over a Fallout: New Vegas load order."
repository = "https://github.com/JorisJonkers-dev/loot-rs"
publish = false

[dependencies]
yaml-rust2 = "0.10"
regex = "1"
# MIT, by the LOOT authors. Opt-in (feature `executable-versions`): the default build does not contain it.
# It pulls in esplugin (GPL-3.0), which this crate's own licence is compatible with.
loot-condition-interpreter = { version = "6", optional = true }

[features]
default = []
# version() and product_version() on executables and DLLs, through loot-condition-interpreter.
executable-versions = ["dep:loot-condition-interpreter"]

[dev-dependencies]
# Property-based tests. 1.12.0 was published 2026-10-10, MIT OR Apache-2.0. No `fork`/`timeout` features, so
# rusty-fork and tempfile stay out of the tree; the std feature is enough for the strategies used.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

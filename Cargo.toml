[package]
name = "loot-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
description = "Read-only evaluator of LOOT masterlist rules over a Fallout: New Vegas load order."
repository = "https://github.com/JorisJonkers-dev/loot-fnv"
publish = false

[dependencies]
yaml-rust2 = "0.10"
regex = "1"

[dev-dependencies]
# Property-based tests. 1.12.0 was published 2026-10-10, MIT OR Apache-2.0. No `fork`/`timeout` features, so
# rusty-fork and tempfile stay out of the tree; the std feature is enough for the strategies used.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

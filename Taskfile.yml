# One command per loop. `task` lists targets; `task check` is what CI runs (the Pipeline workflow runs the
# same tasks as separate steps, so one failing check does not hide the others).
# On NixOS run cargo inside `nix shell nixpkgs#gcc nixpkgs#lld nixpkgs#cargo-llvm-cov nixpkgs#cargo-deny`
# with RUSTFLAGS="-Clink-self-contained=-linker" (see .cargo/config.toml).
version: "3"

vars:
  # Line coverage the tests must reach. The organisation requires at least 80.
  COVERAGE_MIN: 95
  # The unit-test files are not counted (cargo-llvm-cov already skips tests/ and the separate fuzz workspace).
  COVERAGE_IGNORE: '_tests\.rs$'

tasks:
  default:
    cmd: task --list
    silent: true

  fmt:
    desc: Fail if any file is not rustfmt formatted
    cmd: cargo fmt --check

  lint:
    desc: clippy with warnings as errors
    cmds:
      - cargo clippy --locked --all-targets -- -D warnings
      - cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    desc: Unit, property, snapshot and integration tests (no coverage)
    cmd: cargo test --locked

  coverage:
    desc: Tests with cargo-llvm-cov; fails under COVERAGE_MIN percent of lines
    cmd: cargo llvm-cov --locked --fail-under-lines {{.COVERAGE_MIN}} --ignore-filename-regex '{{.COVERAGE_IGNORE}}'

  test:features:
    desc: The same tests with the opt-in cargo features (executable-versions)
    cmd: cargo test --locked --all-features

  test:junit:
    desc: The tests with the opt-in features through cargo-nextest, leaving JUnit in target/nextest/ci/junit.xml (what CI runs on every platform)
    cmds:
      - cargo nextest run --locked --all-features --profile ci
      - cargo test --locked --all-features --doc

  coverage:html:
    desc: HTML coverage report in target/llvm-cov/html
    cmd: cargo llvm-cov --locked --html --ignore-filename-regex '{{.COVERAGE_IGNORE}}'

  limits:
    desc: The resource-limit tests under a 512 MiB address-space limit (a regression fails instead of swapping)
    cmds:
      - cargo test --locked --features executable-versions --test limits --test limits_exe --test limits_sort --no-run --message-format=json | jq -r 'select(.executable != null and (.target.name == "limits" or .target.name == "limits_exe" or .target.name == "limits_sort")).executable' > target/limits-binary.txt
      - |
        while read -r binary; do
          prlimit --as=536870912 -- "$binary" --test-threads=1
        done < target/limits-binary.txt

  bench:
    desc: Sort time and peak memory for 133, 255 and 1024 synthetic plugins of realistic size (generated under target/bench; no game data)
    cmds:
      - cargo build --locked --release --example bench
      - |
        for n in 133 255 1024; do
          [ -f "target/bench/$n/plugins.txt" ] || target/release/examples/bench generate "$n" "target/bench/$n"
          target/release/examples/bench run "target/bench/$n" --runs 5
          target/release/examples/bench run "target/bench/$n" --runs 5 --cache
        done

  build:
    desc: Release build of the CLI
    cmd: cargo build --locked --release

  deny:
    desc: Licences, bans, sources and advisories (deny.toml)
    cmd: cargo deny check

  lint:actions:
    desc: actionlint and zizmor on every workflow
    cmds:
      - actionlint
      - zizmor --offline --no-progress .github/workflows

  scripts:
    desc: Self-tests of the oracle scripts (invented data; no network, no LOOT)
    cmds:
      - python3 -I scripts/oracle/compare.py --selftest
      - python3 -I scripts/oracle/materialise.py --selftest
      - python3 -I scripts/oracle/loot_driver.py --selftest
      - python3 -I scripts/oracle/run.py --selftest
      - python3 -I scripts/oracle/oracle_run.py --selftest
      - python3 -I scripts/oracle/oracle_ci_report.py --selftest
      - python3 -I scripts/oracle/random_diff.py --selftest

  oracle:
    desc: Run loot-rs on every oracle case; with ORACLE_DRIVER set (libloot installed) compare with LOOT. Not part of check
    cmds:
      - cargo build --locked --release
      - python3 -I scripts/oracle/run.py --loot-rs target/release/loot-rs --all {{if .ORACLE_DRIVER}}--driver "{{.ORACLE_DRIVER}}"{{end}}

  oracle:random:
    desc: Differential test on random load orders against the libloot crate (builds its driver; needs network). Not part of check
    cmds:
      - cargo build --locked --release
      - cargo build --release --manifest-path scripts/oracle/libloot-driver/Cargo.toml
      - python3 -I scripts/oracle/random_diff.py --loot-rs target/release/loot-rs --driver scripts/oracle/libloot-driver/target/release/libloot-driver --count {{.COUNT | default "300"}}

  oracle:esplugin:
    desc: Compare loot-rs's plugin header and record readers with esplugin on synthetic plugins (own workspace; needs network for the crates). Not part of check
    cmds:
      - cargo test --release --manifest-path scripts/oracle/esplugin-diff/Cargo.toml

  oracle:real:
    desc: Local only. Run loot-rs and libloot on the owner's real load order from ~/.config/nvmod/oracle.toml; prints the public status only
    cmds:
      - cargo build --locked --release
      - cargo build --release --manifest-path scripts/oracle/libloot-driver/Cargo.toml
      - python3 -I scripts/oracle/oracle_run.py {{.CLI_ARGS}}

  real:
    desc: Ignored tests against the real masterlist (set LOOT_RS_MASTERLIST)
    cmd: cargo test --locked --release --test real_masterlist -- --ignored --nocapture

  secrets:
    desc: Scan every commit for secrets
    cmd: gitleaks git --redact --no-banner --config .gitleaks.toml .

  fuzz:build:
    desc: Build the fuzz targets (needs a nightly toolchain and cargo-fuzz)
    dir: fuzz
    cmd: cargo +nightly fuzz build

  fuzz:smoke:
    desc: Run every fuzz target for FUZZ_SECONDS (default 15) each, seeded (needs nightly and cargo-fuzz)
    cmd: scripts/fuzz-run.sh

  mutants:
    desc: Mutation testing of the condition evaluator (slow; not part of check)
    cmd: cargo mutants --file src/condition.rs --jobs 1

  check:
    desc: Everything CI runs on a pull request
    cmds:
      - task: fmt
      - task: lint
      - task: coverage
      - task: test:features
      - task: limits
      - task: build
      - task: deny
      - task: lint:actions
      - task: scripts
      - task: secrets

  fix:
    desc: Apply formatting
    cmd: cargo fmt

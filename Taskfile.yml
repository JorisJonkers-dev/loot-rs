# One command per loop. `task` lists targets; `task check` is what CI runs (the Pipeline workflow runs the
# same tasks as separate steps, so one failing check does not hide the others).
# On NixOS run cargo inside `nix shell nixpkgs#gcc nixpkgs#lld nixpkgs#cargo-llvm-cov nixpkgs#cargo-deny`
# with RUSTFLAGS="-Clink-self-contained=-linker" (see .cargo/config.toml).
version: "3"

vars:
  # Line coverage the tests must reach. The organisation requires at least 80.
  COVERAGE_MIN: 95
  # The unit-test files are not counted (cargo-llvm-cov already skips tests/ and the separate fuzz workspace).
  COVERAGE_IGNORE: '_tests\.rs$'

tasks:
  default:
    cmd: task --list
    silent: true

  fmt:
    desc: Fail if any file is not rustfmt formatted
    cmd: cargo fmt --check

  lint:
    desc: clippy with warnings as errors
    cmds:
      - cargo clippy --locked --all-targets -- -D warnings
      - cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    desc: Unit, property, snapshot and integration tests (no coverage)
    cmd: cargo test --locked

  coverage:
    desc: Tests with cargo-llvm-cov; fails under COVERAGE_MIN percent of lines
    cmd: cargo llvm-cov --locked --fail-under-lines {{.COVERAGE_MIN}} --ignore-filename-regex '{{.COVERAGE_IGNORE}}'

  test:features:
    desc: The same tests with the opt-in cargo features (executable-versions)
    cmd: cargo test --locked --all-features

  coverage:html:
    desc: HTML coverage report in target/llvm-cov/html
    cmd: cargo llvm-cov --locked --html --ignore-filename-regex '{{.COVERAGE_IGNORE}}'

  limits:
    desc: The resource-limit tests under a 512 MiB address-space limit (a regression fails instead of swapping)
    cmds:
      - cargo test --locked --features executable-versions --test limits --test limits_exe --no-run --message-format=json | jq -r 'select(.executable != null and (.target.name == "limits" or .target.name == "limits_exe")).executable' > target/limits-binary.txt
      - |
        while read -r binary; do
          prlimit --as=536870912 -- "$binary" --test-threads=1
        done < target/limits-binary.txt

  build:
    desc: Release build of the CLI
    cmd: cargo build --locked --release

  deny:
    desc: Licences, bans, sources and advisories (deny.toml)
    cmd: cargo deny check

  lint:actions:
    desc: actionlint and zizmor on every workflow
    cmds:
      - actionlint
      - zizmor --offline --no-progress .github/workflows

  scripts:
    desc: Self-tests of the oracle scripts (invented data; no network, no LOOT)
    cmds:
      - python3 -I scripts/oracle/compare.py --selftest
      - python3 -I scripts/oracle/materialise.py --selftest

  real:
    desc: Ignored tests against the real masterlist (set LOOT_RS_MASTERLIST)
    cmd: cargo test --locked --release --test real_masterlist -- --ignored --nocapture

  secrets:
    desc: Scan every commit for secrets
    cmd: gitleaks git --redact --no-banner --config .gitleaks.toml .

  fuzz:build:
    desc: Build the fuzz targets (needs a nightly toolchain and cargo-fuzz)
    dir: fuzz
    cmd: cargo +nightly fuzz build

  fuzz:smoke:
    desc: Run every fuzz target for FUZZ_SECONDS (default 15) each, seeded (needs nightly and cargo-fuzz)
    cmd: scripts/fuzz-run.sh

  mutants:
    desc: Mutation testing of the condition evaluator (slow; not part of check)
    cmd: cargo mutants --file src/condition.rs --jobs 1

  check:
    desc: Everything CI runs on a pull request
    cmds:
      - task: fmt
      - task: lint
      - task: coverage
      - task: test:features
      - task: limits
      - task: build
      - task: deny
      - task: lint:actions
      - task: scripts
      - task: secrets

  fix:
    desc: Apply formatting
    cmd: cargo fmt

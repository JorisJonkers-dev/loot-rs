globals:
  - type: say
    content: 'hidden by an unsupported function'
    condition: 'product_version("A.esp", ==, "1.0")'
plugins:
  - name: 'A.esp'
    msg:
      - type: say
        content: 'needs the description'
        condition: 'product_version("B.esp", ==, "2")'
      - type: say
        content: 'decided by the supported part'
        condition: 'file("NotInstalled.esp") and product_version("x.exe", >, "1")'
      - type: say
        content: 'true or unsupported is true'
        condition: 'file("B.esp") or product_version("C.esp", <, "3")'
    tag:
      - name: 'Relev'
        condition: 'product_version("A.esp", >, "0")'
    req:
      - name: 'Missing.esp'
        condition: 'product_version("Missing.esp", >=, "2")'

# Mutation testing of the condition evaluator, weekly. Not required: a surviving mutant is a test to write.
name: Mutants

on:
  schedule:
    # Weekly, Tuesday 04:00 UTC.
    - cron: "0 4 * * 2"
  workflow_dispatch:

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  mutants:
    name: cargo-mutants (condition evaluator)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: true


      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants@27.1.0

      - name: Mutate src/condition.rs
        # A mutant can turn a loop into one that never advances and allocates without end: each mutant gets a
        # short timeout and the run an address-space limit, so the runner is not taken down with it.
        run: |
          ulimit -v 6291456
          cargo mutants --file src/condition.rs --jobs 1 --timeout 60 --output mutants-out -- --lib --test prop_condition

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutants-report
          path: mutants-out/mutants.out
          if-no-files-found: ignore
          retention-days: 30

# Keeps the generated feature-catalogue reports on main up to date (docs/TESTING.md, "Feature catalogue"): after every
# push to main, tally renders the catalogue, and when a report changed, one commit with those files only goes onto
# main, marked [skip ci]. Nothing changed means nothing is committed. Pull requests never carry these files; the
# pipeline's "Feature catalogue (tally)" step checks the catalogue itself.
#
# Two jobs, so the token never meets the repository's code:
# - `render` runs the pinned tally binary, with no token, and hands on the files below as an artifact;
# - `commit` makes a fresh checkout, runs no code of the repository, copies exactly those files, and commits and pushes
#   them with the token of raul-progress-bot (contents write, metadata read; a bypass actor of the ruleset "Main",
#   .github/rulesets/main.json, added by the owner with nv-rs scripts/fork/setup-progress-bot.py --bypass loot-rs:Main).
#   Git hooks are off for that commit and push.
# Without the App's variable and secret, `render` still renders and shows the result in its summary; nothing is pushed.
name: Catalogue reports

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tally-progress
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The same pin as ci.yml.
  TALLY_VERSION: v0.1.0
  TALLY_SHA256: 7d8f99a9704dffbd63e5c1a05012a745ca2de34f7faf8fb1318e5c42f2f7415d
  # The only files the bot may commit.
  REPORT_FILES: >-
    docs/COMPATIBILITY.md
    docs/COVERAGE.md
    docs/coverage/tally-report.json
    docs/coverage/tally.svg

jobs:
  render:
    name: Render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render
        run: |
          set -euo pipefail
          # The files the report workflow commits on main must not be ignored, or its `git add` fails there.
          files="$(sed -n '/^  REPORT_FILES: >-$/,/^$/p' .github/workflows/tally-progress.yml | sed -n 's/^    \(docs\/[^ ]*\)$/\1/p')"
          [ -n "$files" ] || { echo "::error title=Feature catalogue::no REPORT_FILES found in tally-progress.yml"; exit 1; }
          # shellcheck disable=SC2086
          if ignored="$(git check-ignore --no-index -v $files)"; then
            echo "::error title=Feature catalogue::report files are ignored by .gitignore: $ignored"; exit 1
          fi
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/tally" "https://github.com/JorisJonkers-dev/tally/releases/download/${TALLY_VERSION}/tally-x86_64-unknown-linux-gnu"
          echo "${TALLY_SHA256}  $RUNNER_TEMP/tally" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/tally"
          tally="$RUNNER_TEMP/tally"
          "$tally" check
          "$tally" doc docs/COMPATIBILITY.md
          mkdir -p docs/coverage
          {
            echo "# Feature coverage"
            echo
            echo "Generated on main by tally from \`catalogue/\` (docs/TESTING.md, \"Feature catalogue\"). Do not edit."
            echo
            "$tally" report --depth 3 --format md
          } >docs/COVERAGE.md
          "$tally" report --depth 3 --format json --out docs/coverage/tally-report.json
          "$tally" report --depth 1 --format svg --out docs/coverage/tally.svg
          "$tally" report --depth 2 --format md >>"$GITHUB_STEP_SUMMARY"
      # Only the report files may change; anything else stops the run.
      - name: What changed
        id: diff
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          printf '%s\n' $REPORT_FILES >"$RUNNER_TEMP/allowed"
          git status --porcelain --untracked-files=all | cut -c4- >"$RUNNER_TEMP/changed"
          if [ ! -s "$RUNNER_TEMP/changed" ]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "The reports are up to date: nothing to commit." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          other="$(grep -vxF -f "$RUNNER_TEMP/allowed" "$RUNNER_TEMP/changed" || true)"
          if [ -n "$other" ]; then
            echo "::error title=Catalogue reports::files other than the reports changed: $other"
            exit 1
          fi
          echo "changed=true" >>"$GITHUB_OUTPUT"
          { echo "Changed:"; sed 's/^/- /' "$RUNNER_TEMP/changed"; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ steps.diff.outputs.changed == 'true' }}
        with:
          name: report-files
          path: |
            docs/COMPATIBILITY.md
            docs/COVERAGE.md
            docs/coverage/
          retention-days: 3

  commit:
    name: Commit
    needs: render
    if: ${{ needs.render.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_APP: ${{ vars.PROGRESS_APP_ID != '' && secrets.PROGRESS_APP_PRIVATE_KEY != '' }}
    steps:
      - name: No App to push with
        if: ${{ env.HAS_APP != 'true' }}
        run: echo "::warning title=Catalogue reports::the reports changed, but PROGRESS_APP_ID or PROGRESS_APP_PRIVATE_KEY is not set; nothing pushed"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.HAS_APP == 'true' }}
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ env.HAS_APP == 'true' }}
        with:
          name: report-files
          path: ${{ runner.temp }}/report-files
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: ${{ env.HAS_APP == 'true' }}
        with:
          app-id: ${{ vars.PROGRESS_APP_ID }}
          private-key: ${{ secrets.PROGRESS_APP_PRIVATE_KEY }}
          permission-contents: write
      # The commit is made on the commit `render` rendered. If main moved on meanwhile, the newer push's run commits.
      - name: Commit and push
        if: ${{ env.HAS_APP == 'true' }}
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p docs/coverage
          # upload-artifact stores the files relative to their common folder (docs/), so docs/coverage/tally.svg is
          # coverage/tally.svg in the artifact.
          for f in $REPORT_FILES; do
            cp "$RUNNER_TEMP/report-files/${f#docs/}" "$f"
          done
          git=(git -c core.hooksPath=/dev/null -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com")
          # shellcheck disable=SC2086
          "${git[@]}" add -- $REPORT_FILES
          if "${git[@]}" diff --cached --quiet; then
            echo "Nothing to commit." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          "${git[@]}" commit --quiet -m "chore(catalogue): update the generated reports [skip ci]"
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          head="$("${git[@]}" ls-remote "$remote" refs/heads/main | cut -f1)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice title=Catalogue reports::main moved on ($head); the newer run commits"
            exit 0
          fi
          "${git[@]}" push --quiet "$remote" HEAD:refs/heads/main
          echo "Pushed $(git rev-parse --short HEAD)." >>"$GITHUB_STEP_SUMMARY"

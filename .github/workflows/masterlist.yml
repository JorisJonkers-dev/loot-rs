# Weekly: fetch the current LOOT masterlist for Fallout: New Vegas and run the ignored real-data tests on it.
# The masterlist is community data (CC0-1.0, https://github.com/loot/falloutnv); it is downloaded into the runner's
# temporary directory and never committed. Not required: a failure means LOOT changed something the reader
# does not handle.
name: Masterlist

on:
  schedule:
    # Weekly, Wednesday 04:00 UTC.
    - cron: "0 4 * * 3"
  workflow_dispatch:
    inputs:
      branch:
        description: Branch of loot/falloutnv that holds the masterlist (the metadata syntax version)
        default: v0.29
        required: false
        type: string

concurrency:
  group: masterlist-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  real-masterlist:
    name: Real masterlist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: true


      - name: Fetch the masterlist
        env:
          BRANCH: ${{ inputs.branch || 'v0.29' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/masterlist.yaml" \
            "https://raw.githubusercontent.com/loot/falloutnv/${BRANCH}/masterlist.yaml"
          wc -c "$RUNNER_TEMP/masterlist.yaml"

      - name: Run the real-masterlist tests
        run: |
          export LOOT_RS_MASTERLIST="$RUNNER_TEMP/masterlist.yaml"
          mise exec -- cargo test --locked --release --test real_masterlist -- --ignored --nocapture | tee "$RUNNER_TEMP/real.txt"
          {
            echo '### Real masterlist'
            echo
            echo '```'
            grep -E '^(entries|conditions|unsupported|unknown|plugins|budget|hard)' "$RUNNER_TEMP/real.txt" || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

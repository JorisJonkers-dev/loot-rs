# One pipeline ending in "Pipeline Complete", the only required check (estate convention). The Rust checks
# are steps of one job (a private repository is billed per job, rounded up to the minute); the two reusable
# workflows (hygiene, PR title) cannot be steps, so they are jobs that the last step gates on.
name: Pipeline

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

# A new commit on a branch cancels the run still going for the older one. Not cancelled: a title edit (its own
# group, so it neither cancels nor is cancelled by a push; no label events trigger this workflow, so a bot
# labelling a new pull request starts nothing) and main (every commit there runs to the end).
concurrency:
  group: pipeline-${{ github.ref == 'refs/heads/main' && github.sha || format('{0}-{1}', github.event.pull_request.number || github.ref, github.event.action == 'edited' && github.run_id || 'commits') }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # Documentation-only changes skip the Rust job. The gate below still runs and still requires everything else.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "code=true" >>"$GITHUB_OUTPUT"; echo "no base to compare with: building"; exit 0
          fi
          if git diff --name-only "$BASE...$HEAD" | grep -qvE '^(docs/|LICENSE$|.*\.md$)'; then
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "code=false" >>"$GITHUB_OUTPUT"; echo "only documentation changed: the Rust job is skipped"
          fi

  hygiene:
    name: Hygiene
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    uses: JorisJonkers-dev/github-workflows/.github/workflows/repository-hygiene-guard.yml@8e402cc4904be3f6bdb53bad3d9b5d7951bed491 # v0.50.3
    with:
      package-proxy-guard: enforce
    secrets:
      PACKAGES_PROXY_TOKEN: ${{ secrets.PACKAGES_PROXY_TOKEN }}

  pr-title:
    name: PR title
    if: ${{ github.event_name == 'pull_request' }}
    uses: JorisJonkers-dev/github-workflows/.github/workflows/pr-title-check.yml@8e402cc4904be3f6bdb53bad3d9b5d7951bed491 # v0.50.3

  rust:
    name: Rust
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
        with:
          cache: true
      # Routes cargo through the packages proxy; the hygiene guard fails a cargo build outside it.
      - name: Set up the packages proxy
        uses: JorisJonkers-dev/github-workflows/actions/setup-package-proxy@8e402cc4904be3f6bdb53bad3d9b5d7951bed491 # v0.50.3
        with:
          token: ${{ secrets.PACKAGES_PROXY_TOKEN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: pipeline
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Separate steps so one failing check does not hide the others.
      - name: Format
        run: mise exec -- task fmt
      - name: Clippy
        if: ${{ !cancelled() }}
        run: mise exec -- task lint
      - name: Tests with the coverage gate
        if: ${{ !cancelled() }}
        run: mise exec -- task coverage
      - name: Coverage per module
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Line coverage per module'
            echo
            echo '```'
            mise exec -- cargo llvm-cov report --summary-only --ignore-filename-regex '_tests\.rs$'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Release build
        if: ${{ !cancelled() }}
        run: mise exec -- task build
      - name: Licences, bans, sources, advisories
        if: ${{ !cancelled() }}
        run: mise exec -- task deny

  pipeline-complete:
    name: Pipeline Complete
    needs: [changes, hygiene, pr-title, rust]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
        with:
          cache: true

      - name: Workflows
        run: mise exec -- task lint:actions
      - name: Script self-tests
        if: ${{ !cancelled() }}
        run: mise exec -- task scripts
      - name: Secrets
        if: ${{ !cancelled() }}
        run: mise exec -- task secrets

      # A skipped job fails, except the two that only run on pull requests (hygiene also skips when its
      # override label is set) and the Rust job when only documentation changed.
      - name: Jobs passed
        if: ${{ !cancelled() }}
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed="$(jq -r '. as $n | to_entries[] | select(.value.result != "success") | select(.value.result != "skipped" or ((.key | IN("hygiene", "pr-title")) or (.key == "rust" and $n.changes.outputs.code == "false") | not)) | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then echo "$failed"; exit 1; fi

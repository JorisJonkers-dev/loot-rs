# One pipeline ending in "Pipeline Complete", the only required check (estate convention). The Rust checks
# are steps of one job (a private repository is billed per job, rounded up to the minute); the two reusable
# workflows (hygiene, PR title) cannot be steps, so they are jobs that the last step gates on.
name: Pipeline

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

# A new commit on a branch cancels the run still going for the older one. Not cancelled: a title edit (its own
# group, so it neither cancels nor is cancelled by a push; no label events trigger this workflow, so a bot
# labelling a new pull request starts nothing) and main (every commit there runs to the end).
concurrency:
  group: pipeline-${{ github.ref == 'refs/heads/main' && github.sha || format('{0}-{1}', github.event.pull_request.number || github.ref, github.event.action == 'edited' && github.run_id || 'commits') }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # The pinned tally release (https://github.com/JorisJonkers-dev/tally) and the SHA-256 of its Linux binary, from
  # that release's SHA256SUMS. Also in tally-progress.yml; bump both together, with `tally ids --generator
  # catalogue/tally_ids_gen.rs`.
  TALLY_VERSION: v0.1.0
  TALLY_SHA256: 7d8f99a9704dffbd63e5c1a05012a745ca2de34f7faf8fb1318e5c42f2f7415d

jobs:
  # Documentation-only changes skip the Rust job. The gate below still runs and still requires everything else.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "code=true" >>"$GITHUB_OUTPUT"; echo "no base to compare with: building"; exit 0
          fi
          if git diff --name-only "$BASE...$HEAD" | grep -qvE '^(docs/|LICENSE$|.*\.md$)'; then
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "code=false" >>"$GITHUB_OUTPUT"; echo "only documentation changed: the Rust job is skipped"
          fi

  hygiene:
    name: Hygiene
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    uses: JorisJonkers-dev/github-workflows/.github/workflows/repository-hygiene-guard.yml@b14d5e031f1abd5bec45e50c898e9e73f3ffc534 # v0.50.4

  pr-title:
    name: PR title
    if: ${{ github.event_name == 'pull_request' }}
    uses: JorisJonkers-dev/github-workflows/.github/workflows/pr-title-check.yml@b14d5e031f1abd5bec45e50c898e9e73f3ffc534 # v0.50.4

  rust:
    name: Rust
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: pipeline
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Separate steps so one failing check does not hide the others.
      - name: Format
        run: mise exec -- task fmt
      - name: Clippy
        if: ${{ !cancelled() }}
        run: mise exec -- task lint
      - name: Tests with the coverage gate
        if: ${{ !cancelled() }}
        run: mise exec -- task coverage
      - name: Tests with the opt-in features
        if: ${{ !cancelled() }}
        run: mise exec -- task test:features
      - name: Resource limits (512 MiB address space)
        if: ${{ !cancelled() }}
        run: mise exec -- task limits
      - name: Coverage per module
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Line coverage per module'
            echo
            echo '```'
            mise exec -- cargo llvm-cov report --summary-only --ignore-filename-regex '_tests\.rs$'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Release build
        if: ${{ !cancelled() }}
        run: mise exec -- task build
      - name: Licences, bans, sources, advisories
        if: ${{ !cancelled() }}
        run: mise exec -- task deny

  # loot-rs is linked into the Toolbox's raul on Linux, Windows and macOS (Toolbox ADR-0006), so it is built and
  # tested natively on Windows and macOS too (Apple silicon). Linux runs the full set above; this job lints and
  # tests, and Pipeline Complete gates on it, so a unix-only call fails the pull request and the release pull
  # request alike.
  platforms:
    name: Build and test (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo test --locked --all-features --no-fail-fast

  # A short run of every fuzz target (seeded), so a parser regression shows on the pull request and not a week
  # later. The weekly workflow runs each for ten minutes. Not cached on pull requests; main saves the cache.
  fuzz-smoke:
    name: Fuzz smoke
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "fuzz -> target"
          shared-key: fuzz-smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz || cargo install --locked cargo-fuzz@0.13.2
      - name: Fuzz every target for 15 seconds
        env:
          FUZZ_SECONDS: "15"
        run: scripts/fuzz-run.sh
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-smoke-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14

  pipeline-complete:
    name: Pipeline Complete
    needs: [changes, hygiene, pr-title, rust, platforms, fuzz-smoke]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: true

      - name: Workflows
        run: mise exec -- task lint:actions
      - name: Script self-tests
        if: ${{ !cancelled() }}
        run: mise exec -- task scripts
      - name: Secrets
        if: ${{ !cancelled() }}
        run: mise exec -- task secrets
      # The feature catalogue (catalogue/, docs/COMPATIBILITY.md): ids, pins, references, evidence and test tags, and
      # against the base revision no id removed without `retired` or an alias. tally is a pinned release binary,
      # checked against its SHA-256; it is not a crate dependency.
      - name: Feature catalogue (tally)
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/tally" "https://github.com/JorisJonkers-dev/tally/releases/download/${TALLY_VERSION}/tally-x86_64-unknown-linux-gnu"
          echo "${TALLY_SHA256}  $RUNNER_TEMP/tally" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/tally"
          if [ -n "${BASE:-}" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            "$RUNNER_TEMP/tally" check --base "$BASE"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "::error title=Feature catalogue::the base revision $BASE is not in the checkout"; exit 1
          else
            "$RUNNER_TEMP/tally" check
          fi
          "$RUNNER_TEMP/tally" report --depth 2 --format md >>"$GITHUB_STEP_SUMMARY"

      # A skipped job fails, except the two that only run on pull requests (hygiene also skips when its
      # override label is set) and the Rust, macOS and fuzz jobs when only documentation changed.
      - name: Jobs passed
        if: ${{ !cancelled() }}
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed="$(jq -r '. as $n | to_entries[] | select(.value.result != "success") | select(.value.result != "skipped" or ((.key | IN("hygiene", "pr-title")) or (.key | IN("rust", "platforms", "fuzz-smoke")) and $n.changes.outputs.code == "false" | not)) | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then echo "$failed"; exit 1; fi

# Tag -> release flow (org standard).
#
# release-please maintains a release PR that accumulates conventional commits and, when merged, creates a
# vX.Y.Z git tag and GitHub Release and bumps Cargo.toml, Cargo.lock and the version manifest. Nothing is
# published to crates.io: the package has `publish = false` and the tag is the release.
name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml

# Releases are serialised and never cancelled half way.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Author the release PR with the personal-stack-agents App token (not the
      # default GITHUB_TOKEN) so CI runs on the PR without a manual approval
      # gate. Best-effort: falls back to GITHUB_TOKEN when the App secrets or
      # installation are absent.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The loot-rs program as an OCI package on ghcr.io, as the Toolbox's packages ADR decides:
  # ghcr.io/jorisjonkers-dev/loot-rs:<version>-x86_64-unknown-linux-gnu. The archive (the binary and LICENSE)
  # is built and checked before it is pushed, its digest is attested in the registry, and the job then pulls the
  # digest anonymously and compares its SHA-256, so a package that is not public fails the release. The repository
  # variable LOOT_RS_FIRST_PACKAGE_PUSH=true skips only that pull, for the first push of a new package (ghcr.io
  # creates it private; make it public, then remove the variable).
  packages:
    needs: release-please
    if: ${{ !cancelled() && github.event_name == 'push' && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # add the package reference to the release notes
      packages: write
      id-token: write
      attestations: write
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OUT: packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: true
      # Routes cargo through the packages proxy; the hygiene guard fails a cargo build outside it.
      - name: Set up the packages proxy
        uses: JorisJonkers-dev/github-workflows/actions/setup-package-proxy@8e402cc4904be3f6bdb53bad3d9b5d7951bed491 # v0.50.3
        with:
          token: ${{ secrets.PACKAGES_PROXY_TOKEN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          save-if: false
      - name: Install oras
        # The repository allows only listed actions, so oras comes from its release, checked by SHA-256.
        env:
          ORAS_VERSION: 1.4.0
          ORAS_SHA256: d8e1dce2fd8ce996f1d901845b688eb0cf505a6082897606f053825bb47935d1
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/oras.tar.gz" "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "${ORAS_SHA256}  $RUNNER_TEMP/oras.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oras"
          tar -xzf "$RUNNER_TEMP/oras.tar.gz" -C "$RUNNER_TEMP/oras" oras
          echo "$RUNNER_TEMP/oras" >> "$GITHUB_PATH"
      - name: Build the archive
        run: |
          set -euo pipefail
          mise exec -- cargo build --locked --release
          mkdir -p "$OUT/stage"
          install -m 0755 target/release/loot-rs "$OUT/stage/loot-rs"
          cp LICENSE "$OUT/stage/"
          tar -czf "$OUT/loot-rs-x86_64-unknown-linux-gnu.tar.gz" -C "$OUT/stage" .
          tar -tzf "$OUT/loot-rs-x86_64-unknown-linux-gnu.tar.gz" >/dev/null
          rm -rf "$OUT/stage"
          sha256sum "$OUT/loot-rs-x86_64-unknown-linux-gnu.tar.gz" | awk '{print $1}' > "$OUT/sha256"
          ls -l "$OUT"
      - name: Push the package
        id: push
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          ref="ghcr.io/jorisjonkers-dev/loot-rs:${VERSION}-x86_64-unknown-linux-gnu"
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          (cd "$OUT" && oras push "$ref" loot-rs-x86_64-unknown-linux-gnu.tar.gz \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.licenses=GPL-3.0-only")
          digest="$(oras resolve "$ref")"
          printf '%s' "$digest" > "$OUT/digest"
          echo "pushed $ref $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/jorisjonkers-dev/loot-rs
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # The attestation above is pushed with the login of the push step; the pull below is anonymous.
      - name: Log out of the registry
        run: oras logout ghcr.io
      - name: Verify the package is public
        if: ${{ vars.LOOT_RS_FIRST_PACKAGE_PUSH != 'true' }}
        run: |
          set -euo pipefail
          digest="$(cat "$OUT/digest")"
          sha="$(cat "$OUT/sha256")"
          rm -rf "$OUT/pull"
          mkdir -p "$OUT/pull"
          oras pull "ghcr.io/jorisjonkers-dev/loot-rs@${digest}" -o "$OUT/pull"
          pulled="$(sha256sum "$OUT/pull/loot-rs-x86_64-unknown-linux-gnu.tar.gz" | awk '{print $1}')"
          echo "pulled $pulled (expected $sha)"
          test "$pulled" = "$sha"
      - name: Record the package reference
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          summary="$(mktemp)"
          {
            echo "## OCI packages"
            echo
            echo "| Name | Tag | Digest | Archive SHA-256 |"
            echo "| --- | --- | --- | --- |"
            echo "| ghcr.io/jorisjonkers-dev/loot-rs | ${VERSION}-x86_64-unknown-linux-gnu | $(cat "$OUT/digest") | $(cat "$OUT/sha256") |"
          } > "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          notes="$(mktemp)"
          { gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body; printf '\n'; cat "$summary"; } > "$notes"
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"

  # On a pull request that changes this workflow: build the archive from the checked-out source and print what a
  # release would push, without logging in to a registry and without any write permission.
  packages-dry-run:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: true
      # Routes cargo through the packages proxy; the hygiene guard fails a cargo build outside it.
      - name: Set up the packages proxy
        uses: JorisJonkers-dev/github-workflows/actions/setup-package-proxy@8e402cc4904be3f6bdb53bad3d9b5d7951bed491 # v0.50.3
        with:
          token: ${{ secrets.PACKAGES_PROXY_TOKEN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          save-if: false
      - name: Build the archive
        env:
          OUT: packages
        run: |
          set -euo pipefail
          mise exec -- cargo build --locked --release
          mkdir -p "$OUT/stage"
          install -m 0755 target/release/loot-rs "$OUT/stage/loot-rs"
          cp LICENSE "$OUT/stage/"
          tar -czf "$OUT/loot-rs-x86_64-unknown-linux-gnu.tar.gz" -C "$OUT/stage" .
          tar -tzf "$OUT/loot-rs-x86_64-unknown-linux-gnu.tar.gz" >/dev/null
      - name: Print what would be pushed
        env:
          OUT: packages
        run: |
          set -euo pipefail
          echo "Would push: ghcr.io/jorisjonkers-dev/loot-rs:0.0.0-dry-run-x86_64-unknown-linux-gnu"
          echo "Archive SHA-256: $(sha256sum "$OUT/loot-rs-x86_64-unknown-linux-gnu.tar.gz" | awk '{print $1}')"

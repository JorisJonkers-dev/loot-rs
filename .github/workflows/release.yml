# Tag -> release flow (org standard).
#
# release-please maintains a release PR that accumulates conventional commits and, when merged, creates a
# vX.Y.Z git tag and GitHub Release and bumps Cargo.toml, Cargo.lock and the version manifest. Nothing is
# published to crates.io: the package has `publish = false` and the tag is the release.
name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag, vX.Y.Z. Empty runs the dry run from the selected ref
        required: false
        type: string
      publish:
        description: Publish the tag's assets and package (false is a dry run)
        required: false
        default: false
        type: boolean
      macos_only:
        description: With tag and publish, build and upload only the macOS asset (the package is left as it is)
        required: false
        default: false
        type: boolean

# Releases are serialised and never cancelled half way.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Author the release PR with the release App token (not the
      # default GITHUB_TOKEN) so CI runs on the PR without a manual approval
      # gate. Best-effort: falls back to GITHUB_TOKEN when the App secrets or
      # installation are absent.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please cannot edit Cargo.lock, so the release PR would fail every `--locked` build. Refresh the
      # workspace crates' own lock entries on the release branch, with the App token so that CI runs on the commit.
      # The open release PR is looked up by its label: release-please reports `pr` only when it changed the PR.
      - name: Find the release pull request
        id: release-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.rp.outputs.pr }}
        run: |
          set -euo pipefail
          # release-please reports the pull request it opened or changed in `pr`; use that first. The label
          # lookup is the fallback, retried, because the label is added after the pull request is opened.
          branch=""
          if [[ -n $RELEASE_PR ]]; then
            branch="$(jq -r '.headBranchName // ""' <<<"$RELEASE_PR")"
          fi
          for _ in 1 2 3 4 5 6; do
            [[ -n $branch ]] && break
            branch="$(gh pr list --repo "$REPO" --state open --label 'autorelease: pending' --json headRefName --jq '.[0].headRefName // ""')"
            [[ -n $branch ]] || sleep 10
          done
          echo "branch=$branch" >>"$GITHUB_OUTPUT"
          echo "release pull request branch: ${branch:-none}"
      - if: ${{ steps.release-pr.outputs.branch != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release-pr.outputs.branch }}
          persist-credentials: false
      # The refresh is `cargo update --workspace`, which only moves the workspace crates' own entries and keeps
      # every other locked version. The 7-day crate cooldown holds: this checkout reads the repository's
      # .cargo/config.toml (`[registry] global-min-publish-age = "7 days"`), so do not pass --config or a
      # CARGO_REGISTRY_* override, and never run a plain `cargo update` without `--workspace`, which would move
      # third-party crates to versions published less than 7 days ago.
      - if: ${{ steps.release-pr.outputs.branch != '' }}
        name: Refresh the lock entries of the workspace crates
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          set -euo pipefail
          cargo update --workspace
          cargo update --workspace --manifest-path fuzz/Cargo.toml
          if git diff --quiet; then echo "the lock entries are current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): refresh the workspace lock entries"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"

  # The loot-rs program as an OCI package on ghcr.io, as the Toolbox's packages ADR decides:
  # ghcr.io/jorisjonkers-dev/loot-rs:<version>-x86_64-unknown-linux-gnu. The archive (the binary and LICENSE)
  # is built and checked before it is pushed, its digest is attested in the registry, and the job then pulls the
  # digest anonymously and compares its SHA-256, so a package that is not public fails the release. The repository
  # variable LOOT_RS_FIRST_PACKAGE_PUSH=true skips only that pull, for the first push of a new package (ghcr.io
  # creates it private; make it public, then remove the variable).
  packages:
    needs: release-please
    if: ${{ !cancelled() && ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') || (inputs.tag != '' && inputs.publish && !inputs.macos_only)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # add the package reference to the release notes
      packages: write
      id-token: write
      attestations: write
    env:
      TAG_NAME: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OUT: packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          save-if: false
      - name: Install oras
        # The repository allows only listed actions, so oras comes from its release, checked by SHA-256.
        env:
          ORAS_VERSION: 1.4.0
          ORAS_SHA256: d8e1dce2fd8ce996f1d901845b688eb0cf505a6082897606f053825bb47935d1
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/oras.tar.gz" "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "${ORAS_SHA256}  $RUNNER_TEMP/oras.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oras"
          tar -xzf "$RUNNER_TEMP/oras.tar.gz" -C "$RUNNER_TEMP/oras" oras
          echo "$RUNNER_TEMP/oras" >> "$GITHUB_PATH"
      - name: Build the archive
        run: |
          set -euo pipefail
          mise exec -- cargo build --locked --release
          mkdir -p "$OUT/stage"
          install -m 0755 target/release/loot-rs "$OUT/stage/loot-rs"
          cp LICENSE "$OUT/stage/"
          tar -czf "$OUT/loot-rs-x86_64-unknown-linux-gnu.tar.gz" -C "$OUT/stage" .
          tar -tzf "$OUT/loot-rs-x86_64-unknown-linux-gnu.tar.gz" >/dev/null
          rm -rf "$OUT/stage"
          sha256sum "$OUT/loot-rs-x86_64-unknown-linux-gnu.tar.gz" | awk '{print $1}' > "$OUT/sha256"
          ls -l "$OUT"
      - name: Push the package
        id: push
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # The commit the tag points at (the job checked the tag out), also when the workflow runs from main.
          REVISION="$(git rev-parse HEAD)"
          VERSION="${TAG_NAME#v}"
          ref="ghcr.io/jorisjonkers-dev/loot-rs:${VERSION}-x86_64-unknown-linux-gnu"
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          (cd "$OUT" && oras push "$ref" loot-rs-x86_64-unknown-linux-gnu.tar.gz \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${REVISION}" \
            --annotation "org.opencontainers.image.licenses=GPL-3.0-only")
          digest="$(oras resolve "$ref")"
          printf '%s' "$digest" > "$OUT/digest"
          echo "pushed $ref $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/jorisjonkers-dev/loot-rs
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # The attestation above is pushed with the login of the push step; the pull below is anonymous.
      - name: Log out of the registry
        run: oras logout ghcr.io
      - name: Verify the package is public
        if: ${{ vars.LOOT_RS_FIRST_PACKAGE_PUSH != 'true' }}
        run: |
          set -euo pipefail
          digest="$(cat "$OUT/digest")"
          sha="$(cat "$OUT/sha256")"
          rm -rf "$OUT/pull"
          mkdir -p "$OUT/pull"
          oras pull "ghcr.io/jorisjonkers-dev/loot-rs@${digest}" -o "$OUT/pull"
          pulled="$(sha256sum "$OUT/pull/loot-rs-x86_64-unknown-linux-gnu.tar.gz" | awk '{print $1}')"
          echo "pulled $pulled (expected $sha)"
          test "$pulled" = "$sha"
      - name: Record the package reference
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          summary="$(mktemp)"
          {
            echo "## OCI packages"
            echo
            echo "| Name | Tag | Digest | Archive SHA-256 |"
            echo "| --- | --- | --- | --- |"
            echo "| ghcr.io/jorisjonkers-dev/loot-rs | ${VERSION}-x86_64-unknown-linux-gnu | $(cat "$OUT/digest") | $(cat "$OUT/sha256") |"
          } > "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          notes="$(mktemp)"
          { gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body; printf '\n'; cat "$summary"; } > "$notes"
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"

  # The macOS release asset, loot-rs-universal-apple-darwin.tar.gz (the binary for Apple silicon and Intel, and LICENSE)
  # with its .sha256. `macos-half` builds one processor per runner in parallel (x86_64 cross-compiled on Apple silicon);
  # `macos-asset` joins them with lipo, checks both architectures, runs `contracts --json`, attests and uploads the
  # archive to the release (`gh release upload --clobber`). On a pull request that changes this workflow and on a dry run the same
  # archive is built and kept as a workflow artifact. Uncached: a release build starts from the tag's sources only.
  # To add the asset to an existing release without a new version:
  #   gh workflow run release.yml -R JorisJonkers-dev/loot-rs --ref main -f tag=vX.Y.Z -f publish=true -f macos_only=true
  macos-half:
    needs: release-please
    if: ${{ !cancelled() && ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    name: macOS loot-rs (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false
      - name: Build loot-rs
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add "$TARGET"
          cargo build --locked --release --target "$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loot-rs-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/loot-rs
          if-no-files-found: error
          retention-days: 3

  macos-asset:
    needs: [release-please, macos-half]
    if: ${{ !cancelled() && needs.macos-half.result == 'success' }}
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload the asset to the release
      id-token: write
      attestations: write
    env:
      TAG_NAME: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      PUBLISH: ${{ (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') || (inputs.tag != '' && inputs.publish) }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ASSET: loot-rs-universal-apple-darwin.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: loot-rs-*-apple-darwin
          path: ${{ runner.temp }}/halves
      - name: Join, check and pack
        run: |
          set -euo pipefail
          mkdir -p out/stage
          lipo -create -output out/stage/loot-rs \
            "$RUNNER_TEMP/halves/loot-rs-aarch64-apple-darwin/loot-rs" "$RUNNER_TEMP/halves/loot-rs-x86_64-apple-darwin/loot-rs"
          chmod 0755 out/stage/loot-rs
          lipo -archs out/stage/loot-rs | tee "$RUNNER_TEMP/archs"
          grep -qw arm64 "$RUNNER_TEMP/archs" && grep -qw x86_64 "$RUNNER_TEMP/archs"
          out/stage/loot-rs contracts --json >/dev/null
          cp LICENSE out/stage/
          COPYFILE_DISABLE=1 tar -czf "out/$ASSET" -C out/stage .
          rm -rf out/stage
          (cd out && shasum -a 256 "$ASSET" > "$ASSET.sha256" && cat "$ASSET.sha256")
      - name: Attest build provenance
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/${{ env.ASSET }}
      - name: Upload to the release
        if: ${{ env.PUBLISH == 'true' }}
        run: gh release upload "$TAG_NAME" out/* --clobber --repo "$GITHUB_REPOSITORY"
      - name: Keep the archive of a dry run
        if: ${{ env.PUBLISH != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loot-rs-macos-dry-run
          path: out/
          retention-days: 7

  # On a pull request that changes this workflow: build the archive from the checked-out source and print what a
  # release would push, without logging in to a registry and without any write permission.
  packages-dry-run:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !(inputs.tag != '' && inputs.publish)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          save-if: false
      - name: Build the archive
        env:
          OUT: packages
        run: |
          set -euo pipefail
          mise exec -- cargo build --locked --release
          mkdir -p "$OUT/stage"
          install -m 0755 target/release/loot-rs "$OUT/stage/loot-rs"
          cp LICENSE "$OUT/stage/"
          tar -czf "$OUT/loot-rs-x86_64-unknown-linux-gnu.tar.gz" -C "$OUT/stage" .
          tar -tzf "$OUT/loot-rs-x86_64-unknown-linux-gnu.tar.gz" >/dev/null
      - name: Print what would be pushed
        env:
          OUT: packages
        run: |
          set -euo pipefail
          echo "Would push: ghcr.io/jorisjonkers-dev/loot-rs:0.0.0-dry-run-x86_64-unknown-linux-gnu"
          echo "Archive SHA-256: $(sha256sum "$OUT/loot-rs-x86_64-unknown-linux-gnu.tar.gz" | awk '{print $1}')"

# cargo-deny configuration. Run locally with `cargo deny check` (task deny).
# The project itself is GPL-3.0-only; every third-party licence allowed below is compatible with it.

[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[output]
feature-depth = 1

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# Add RUSTSEC ids here only with a comment saying why the advisory does not apply; an empty list is the goal.
ignore = []
yanked = "deny"

[licenses]
version = 2
# What the dependency tree needs today. A new licence is added only after reading it for GPL-3.0 compatibility.
allow = [
    "MIT",
    "Apache-2.0",
    "Zlib",         # foldhash, through yaml-rust2
    "BSD-3-Clause", # encoding_rs (with Apache-2.0 OR MIT), through yaml-rust2
    # esplugin, through loot-condition-interpreter, which is only in the tree with the opt-in feature
    # `executable-versions`. GPL-3.0 is this project's own licence, so it is compatible; the default build
    # does not contain it.
    "GPL-3.0",
]
confidence-threshold = 0.8
exceptions = []

# This crate is publish = false, so its own GPL-3.0-only is not checked against `allow`.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
